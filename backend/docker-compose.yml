services:
  mysql:
    image: mysql:8.4
    container_name: base-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wasd123
      MYSQL_DATABASE: base-app-db
    ports:
      - "3306:3306"
    volumes:
      - base_app_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  base_app_mysql_data:
