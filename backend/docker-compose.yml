services:
  mysql:
    image: mysql:8.4
    container_name: mail-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wasd123
      MYSQL_DATABASE: mail-app-db
    ports:
      - "3310:3306"
    volumes:
      - mail_app_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mail_app_mysql_data:
